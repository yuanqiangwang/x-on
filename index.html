<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x-on</title>
    <style>
      /* 霞鹜文楷屏显版 GB, 打包进前端资源随应用分发 (SIL OFL-1.1)。 */
      @font-face {
        font-family: "LXGW WenKai GB Screen";
        src: url("/fonts/LXGWWenKaiGBScreen.woff2") format("woff2");
        font-weight: normal;
        font-display: swap;
      }
      :root {
        --bg: #05060a;
        --border: #122019;
        --accent: #3dff9e;
        --accent-dim: rgba(61, 255, 158, 0.35);
        --accent-faint: rgba(61, 255, 158, 0.10);
        --text: #d7e9dd;
        --text-head: #eefbe6;
        --muted: #58655c;
        --font: "LXGW WenKai GB Screen", "LXGW WenKai", "PingFang SC",
          "Microsoft YaHei", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #05060a;
        color: var(--text);
        font-family: var(--font);
        font-variant-ligatures: none;
      }
      /* Neon-geek launcher: near-black + terminal green. Opaque, flat — no glass,
         no gradient washes. The "neon" comes only from the accent highlight. */
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 12px 14px 8px;
      }

      /* Terminal prompt row: a green › with the raw search field underneath. */
      #searchrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 9px;
        border-bottom: 1px solid var(--accent);
        box-shadow: 0 1px 0 0 rgba(61, 255, 158, 0.06);
      }
      #searchrow .mark {
        color: var(--accent);
        font-size: 18px;
        text-shadow: 0 0 8px var(--accent-dim);
        user-select: none;
      }
      #search {
        flex: 1;
        padding: 4px 0;
        font: inherit;
        font-size: 18px;
        color: var(--accent);
        caret-color: var(--accent);
        background: transparent;
        border: none;
        outline: none;
      }
      #search::placeholder { color: var(--muted); }

      #results {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        overflow-y: auto;
        flex: 1;
      }
      /* Thin, borderless, terminal-green scrollbar — the native WinUI one breaks
         the neon-geek look. Track stays invisible; thumb is a quiet green nub. */
      #results::-webkit-scrollbar { width: 6px; height: 6px; }
      #results::-webkit-scrollbar-track { background: transparent; }
      #results::-webkit-scrollbar-thumb {
        background: var(--accent-dim);
        border-radius: 3px;
      }
      #results::-webkit-scrollbar-thumb:hover { background: var(--accent); }
      #results::-webkit-scrollbar-corner { background: transparent; }
      #results li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        border-left: 2px solid transparent;
        border-radius: 0 4px 4px 0;
        color: var(--text);
      }
      #results li.active {
        background: var(--accent-faint);
        border-left-color: var(--accent);
      }
      #results li img,
      #results li .avatar {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        flex: 0 0 24px;
        object-fit: contain;
        border: 1px solid var(--border);
        background: transparent;
      }
      #results li .avatar {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        font-weight: 700;
        font-family: var(--font);
      }
      #results li .meta { display: flex; flex-direction: column; min-width: 0; }
      #results li .name {
        color: var(--text-head);
        font-size: 14px;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #results li.active .name {
        color: var(--accent);
        text-shadow: 0 0 6px var(--accent-dim);
      }
      #results li .comment { color: var(--muted); font-size: 11px; }

      /* keyboard hints footer */
      #footer {
        margin-top: 8px;
        padding-top: 6px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        text-align: center;
        letter-spacing: 0.04em;
        user-select: none;
      }
      #footer b { color: var(--accent); font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="searchrow">
        <span class="mark">›</span>
        <input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="搜索应用…" />
      </div>
      <ul id="results"></ul>
      <div id="footer">
        <b>↑↓</b> 选择 &nbsp; <b>↵</b> 启动 &nbsp; <b>Esc</b> 隐藏 &nbsp; <b>Alt+Space</b> 唤出
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
